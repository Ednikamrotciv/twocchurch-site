<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<meta name="theme-color" content="#08080a">
<title>The World Overcomers' Ministries Inc. — Where Champions Are Raised in Christ</title>
<meta name="description" content="A global family of believers on four continents. Watch sermons, find a branch near you with directions, send a prayer request, share your testimony, read the daily devotional and give online.">

<div id="root"></div>

<noscript>
  <p style="text-align:center;padding:2rem;font-family:Georgia,serif;font-size:1.1rem">
    This website needs JavaScript to display. Please enable it, or call the church office on +1 (214) 555-0147.
  </p>
</noscript>

<style>
  html { background: #07070a; }
</style>

<script>
  window.__womBootErrors = [];
  window.addEventListener("error", function (e) {
    window.__womBootErrors.push(String((e && e.message) || e));
  }, true);
  window.addEventListener("unhandledrejection", function (e) {
    window.__womBootErrors.push("Promise: " + String((e && e.reason && (e.reason.message || e.reason)) || e));
  });
  window.setTimeout(function () {
    var root = document.getElementById("root");
    if (!root || root.hasChildNodes()) return;
    var banner = document.createElement("p");
    banner.style.cssText = "position:fixed;top:0;left:0;right:0;z-index:500;margin:0;padding:0.6rem 1rem;background:#3a1111;color:#f0b0b0;font:0.8rem/1.4 system-ui,sans-serif;text-align:center;";
    banner.textContent = window.__womBootErrors.length
      ? "Could not start: " + window.__womBootErrors[0]
      : "Still starting — the first load compiles the site; wait a little, then reload once";
    document.body.appendChild(banner);
  }, 20000);
</script>
<script type="module" src="/src/main.tsx"></script>
