<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<!-- The shipped update number: the pre-bundle gate below paints the maintenance
     notice before React boots whenever this copy has not published it yet.
     Bump with BUILD_NOTES (src/lib/hooks.ts) on every update. -->
<meta name="wom-notes" content="421" />
<!-- The shipped code word (unnumbered stale fix): names the running code with
     no number, so the gate below holds for this fix even though the update
     number is unchanged. build-static.mjs stamps it from hooks.ts CODE_ID. -->
<meta name="wom-code" content="ip421b" />

<meta name="theme-color" content="#08080a">

<div id="root"></div>

<noscript>
  <p style="text-align:center;padding:2rem;font-family:Georgia,serif;font-size:1.1rem">

  </p>
</noscript>

<style>
  html { background: #07070a; }
</style>

<script>
  window.__womBootErrors = [];
  /* Name the failed file (note 374): a resource error event carries no
     message (String(event) is "[object Event]"), so describe the element —
     the next "Could not start" names the file instead of an object. */
  function __womDescribeErr(e) {
    try {
      var t = e && e.target;
      if (t && t !== window && t.tagName) {
        var url = t.src || t.href || "";
        return "could not load " + String(t.tagName).toLowerCase() + (url ? " " + url : "") + " — reload once; if it repeats, the host's files are mixed";
      }
      if (e && e.message) return String(e.message);
    } catch (_) {}
    try { return String(e); } catch (_) { return "unknown boot error"; }
  }
  window.addEventListener("error", function (e) {
    window.__womBootErrors.push(__womDescribeErr(e));
    /* A file that fails before React boots (a stale cached page naming a
       pruned bundle, a mid-deploy load, a tunnel hiccup) heals with one
       plain reload — try it once per tab instead of sitting black. */
    try {
      var t = e && e.target;
      if (t && t !== window && t.tagName) {
        var root = document.getElementById("root");
        if ((!root || !root.hasChildNodes()) && window.sessionStorage && !window.sessionStorage.getItem("wom.boot.retried")) {
          window.sessionStorage.setItem("wom.boot.retried", "1");
          window.location.reload();
        }
      }
    } catch (_) {}
  }, true);
  window.addEventListener("unhandledrejection", function (e) {
    var r = e && e.reason;
    var msg = (r && (r.message || r.statusText)) || (typeof r === "string" ? r : null) || "a background task failed before boot — reload once";
    window.__womBootErrors.push("Promise: " + msg);
  });
  window.setTimeout(function () {
    var root = document.getElementById("root");
    if (!root || root.hasChildNodes()) return;
    var banner = document.createElement("p");
    banner.style.cssText = "position:fixed;top:0;left:0;right:0;z-index:500;margin:0;padding:0.6rem 1rem;background:#3a1111;color:#f0b0b0;font:0.8rem/1.4 system-ui,sans-serif;text-align:center;";
    banner.textContent = window.__womBootErrors.length
      ? "Could not start: " + window.__womBootErrors[0]
      : "Still starting — the first load compiles the site; wait a little, then reload once";
    document.body.appendChild(banner);
  }, 20000);
</script>
<script>
  /* Pre-bundle maintenance gate (notes 302, 421): the JS bundle may be stale or
     still compiling when an update lands — this paints the maintenance notice
     BEFORE React boots, so visitors never see live words from cached code and
     never need a hard refresh. It decides from the same stamp the app uses
     (stored publish notes vs the shipped wom-notes meta — proven unreleased
     only, never fresh profiles), does nothing when published, and yields to
     React the moment it mounts. Skipped for the
     office preview pass (?preview=1), which the app itself bypasses. */
  (function () {
    try {
      var q = new URLSearchParams(window.location.search || "");
      /* Paint the maintenance notice into the still-empty root (shared by the
         forced pass and the shipped-update lock below). Yields the moment
         React mounts, so it never covers the live site. */
      var paintMaint = function () {
        var r = document.getElementById("root");
        if (!r || r.hasChildNodes()) return;
        r.innerHTML =
          '<div style="min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1rem;background:#07070a;color:#f5f0e6;font-family:Georgia,serif;text-align:center;padding:2rem;">' +
          '<img src="/src/assets/logo-mark.png" alt="" aria-hidden="true" style="width:72px;height:72px;object-fit:contain;" onerror="this.style.display=\'none\'">' +
          "<h1 style=\"margin:0;font-size:2rem;font-weight:600;\">We&rsquo;ll be right back</h1>" +
          '<p style="margin:0;max-width:34rem;line-height:1.6;opacity:0.85;">The site is being updated. Please check back shortly.</p>' +
          "</div>";
      };
      if (q.get("preview") === "1") return;
      try {
        if (window.sessionStorage && window.sessionStorage.getItem("wom.cms.preview") === "1") return;
      } catch (e) {}
      /* The office console is never gated (note 303): the maintenance notice
         belongs to the visitors' site only — /admin must always boot straight
         into the console, even mid-update. */
      try {
        var ap = window.location.pathname || "/";
        if (ap === "/admin" || ap.indexOf("/admin/") === 0) return;
      } catch (e) {}
      /* Local preview (office request: notice missing in local): ?maintenance=1
         paints the notice at once, even with no version.json / no server.
         Hash-routed copies carry the pass after the # (e.g. /#/?maintenance=1). */
      try {
        var forced = q.get("maintenance") === "1" || q.get("showMaintenance") === "1";
        if (!forced) {
          var hh = String(window.location.hash || "");
          var qi = hh.indexOf("?");
          if (qi !== -1) {
            var hq = new URLSearchParams(hh.slice(qi + 1));
            forced = hq.get("maintenance") === "1" || hq.get("showMaintenance") === "1";
          }
        }
        if (forced) {
          paintMaint();
          return;
        }
      } catch (e) {}
      var stored = 0;
      try {
        var raw = window.localStorage ? window.localStorage.getItem("wom.cms.notes") : null;
        var n = raw === null ? 0 : Number(JSON.parse(raw));
        if (Number.isFinite(n) && n > 0) stored = Math.floor(n);
      } catch (e) {}
      /* Proven unreleased (note 421): this browser's last witnessed publish
         trails the shipped update, so React will agree once it boots (same
         shared stamp) — paint at once instead of a blank screen. Fresh
         profiles (no stamp) skip the gate and let React decide with full
         state, so a published site never flashes the notice. Releasable
         copies only: dev (no stamped deploy, or a dev- boot stamp), or a
         server/feed behind the copy. A stamped deploy with neither can never
         be released, so it boots live. */
      try {
        var shipped = 0;
        var mn = document.querySelector('meta[name="wom-notes"]');
        var mc = mn ? mn.getAttribute("content") : "";
        var mp = parseInt(String(mc || ""), 10);
        if (isFinite(mp) && mp > 0) shipped = Math.floor(mp);
        var stored = null;
        try {
          var raw = window.localStorage ? window.localStorage.getItem("wom.cms.notes") : null;
          var nn = raw === null ? null : Number(JSON.parse(raw));
          if (Number.isFinite(nn) && nn > 0) stored = Math.floor(nn);
        } catch (e) {}
        if (shipped > 0 && stored !== null && stored < shipped) {
          var dm = document.querySelector('meta[name="wom-deploy"]');
          var dc = dm ? dm.getAttribute("content") : "";
          var releasable = !dc || String(dc).indexOf("dev-") === 0 ||
            !!document.querySelector('meta[name="wom-server"]') ||
            !!document.querySelector('meta[name="wom-feed"]');
          if (releasable) {
            paintMaint();
            return;
          }
        }
      } catch (e) {}
    } catch (e) {}
  })();
</script>
<script type="module" src="/src/main.tsx"></script>
